[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genius-kitchen"
version = "2.0.0"
description = "Desktop food inventory and recipe-matching application"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jirapas Wongtreenatrkoon"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.10", "coverage==7.16.2"]

[project.scripts]
genius-kitchen = "genius_kitchen.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genius_kitchen = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["genius_kitchen"]

[tool.coverage.report]
show_missing = true
precision = 2
